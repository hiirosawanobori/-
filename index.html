<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災学習ゲーム</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- スタート画面 -->
<div id="startScreen" class="screen">

   <h1 class="gameLogo">
    <img src="images/logo.png" alt="MISSION! ぼうさいタウン">
</h1>


<button id="startButton" aria-label="ゲームスタート">
    <img src="images/start.png" alt="ゲームスタート">
</button>

</div>


<!-- 人数設定 -->
<div id="playerScreen" class="screen" style="display:none;">

    

    <select id="playerCount">
        <option value="2">2人</option>
        <option value="3">3人</option>
        <option value="4">4人</option>
        <option value="5" selected>5人</option>
        <option value="6">6人</option>
    </select>

    <br><br>

    <button id="nextButton" aria-label="次へ">
        <img src="images/next.png" alt="次へ">
    </button>

</div>


<!-- 名前入力 -->
<div id="nameScreen" class="screen" style="display:none;">

    <h2>
    <ruby>住民<rt>じゅうみん</rt></ruby>の
    <ruby>名前<rt>なまえ</rt></ruby>を
    <ruby>入力<rt>にゅうりょく</rt></ruby>してください
</h2>

<div id="nameInputs"></div>

<br>

<button id="gameStartButton" aria-label="次へ">
    <img src="images/next.png" alt="次へ">
</button>

</div>


<!-- 政策投票 -->
<div id="policyScreen" class="screen" style="display:none;">

 <h2>
    <ruby>市長<rt>しちょう</rt></ruby>の
    お<ruby>話<rt>はなし</rt></ruby>を
    <ruby>聞<rt>き</rt></ruby>いて、<br>
    <ruby>協力<rt>きょうりょく</rt></ruby>するか
    <ruby>選<rt>えら</rt></ruby>ぼう！
</h2>

<h3 id="residentTurn"></h3>

<br>

<button id="agreeButton">
    <ruby>協力<rt>きょうりょく</rt></ruby>する
</button>

<br><br>

<button id="disagreeButton">
    <ruby>協力<rt>きょうりょく</rt></ruby>しない
</button>

</div>

<!-- 政策結果画面 -->
<div id="policyResultScreen" class="screen" style="display:none;">

    <h2 id="policyResultText"></h2>

    <br><br>

   <button id="policyNextButton" aria-label="次へ">
    <img src="images/next.png" alt="次へ">
</button>

</div>




<!-- 日常ターン -->
<!-- 日常ターン -->
<div id="dailyScreen" class="screen" style="display:none;">

    <h2 id="turnTitle" style="display:none;"></h2>

<h3 id="dailyResident"></h3>

<div id="pointArea">

<p>
    <ruby>行動<rt>こうどう</rt></ruby>ポイント：
    <span id="actionPoint">0</span>
</p>

<p>
    <ruby>防災<rt>ぼうさい</rt></ruby>ポイント：
    <span id="disasterPoint">0</span>
</p>

<p>
    <ruby>満足<rt>まんぞく</rt></ruby>ポイント：：
    <span id="happyPoint">0</span>
</p>

</div>


<div id="choiceArea"></div>


</div><!-- ミニゲーム結果入力 -->
<div id="miniGameScreen" class="screen" style="display:none;">

    <h2>ミニゲーム結果</h2>

    <p>GMが報酬ポイントを入力してください。</p>

    <div id="miniGameArea"></div>

    <br>

    <button id="miniGameNextButton">
        決定
    </button>

</div>

<!-- 自然災害発生画面 -->
<div id="disasterScreen" class="screen" style="display:none;">


<br>

<button id="disasterNextButton">
    <ruby>次<rt>つぎ</rt></ruby>へ
</button>

</div>

<!-- 結果発表画面 -->
<div id="resultScreen" class="screen" style="display:none;">



<div id="resultArea"></div>

</div>

<script src="script.js"></script>

</body>
</html>
